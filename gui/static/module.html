<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="module-icon.svg" type="image/svg+xml"><title>モジュール — ECOBuild</title>
<link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="tasks.css"><link rel="stylesheet" href="modinfo.css"><link rel="stylesheet" href="branches.css"><link rel="stylesheet" href="ci.css"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="help.css"></head>
<body>
<header><img class="brand-icon" src="module-icon.svg" alt="ECOBuild" title="ECOBuild" width="22" height="22"><h1 id="module-title"></h1>
</header>
<div class="module-shell">
  <nav class="module-nav" aria-label="モジュールメニュー">
    <button type="button" id="nav-toggle" class="nav-toggle" aria-expanded="true" title="メニューを折りたたむ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button type="button" id="modinfo-menu" aria-controls="modinfo-content" title="モジュール"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span>モジュール</span></button>
    <button type="button" id="modagent-menu" aria-controls="modagent-content" title="エージェント（モジュールの進行役と話す。タスクは要りません）"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V4M9 12h.01M15 12h.01M9 16h6"/></svg><span>エージェント</span></button>
    <button type="button" id="workspace-menu" aria-current="page" aria-controls="workspace-content" title="作業空間"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>作業空間</span></button>
    <button type="button" id="tasks-menu" aria-controls="tasks-content" title="タスク管理"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>タスク管理</span></button>
    <button type="button" id="branches-menu" aria-controls="branches-content" title="ブランチ（共有ブランチ同士の取り込み、作成・削除・保護と、届いている提出の処理）"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10"/><path d="M18 10c0 4-6 3-11.2 7.5"/></svg><span>ブランチ</span></button>
    <button type="button" id="manage-menu" aria-controls="manage-content" title="管理（メンバー・CI。管理者だけが変えられます）"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>管理</span></button>
    <div class="nav-bottom">
  <button type="button" id="settings-menu" aria-controls="settings-content" title="設定"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>設定</span></button>
  <button type="button" id="help-menu" aria-controls="help-content" title="ヘルプ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg><span>ヘルプ</span></button>
      <div class="nav-account" id="nav-account" title="ログイン中のGitHubアカウント"><span class="nav-avatar" aria-hidden="true">?</span><span class="nav-account-name">…</span></div>
    </div>
  </nav>
  <section class="module-content" id="workspace-content" aria-labelledby="workspace-menu"><nav class="tabs" role="tablist" aria-label="作業空間"></nav><div class="panels"></div></section>
  <section id="tasks-content" class="tk" aria-label="タスク管理" hidden>
    <div class="tk-top">
      <div class="tk-top-title"><h2>タスク管理</h2></div>
      <div class="tk-top-actions"><button type="button" id="tk-reload" title="GitHubから読み込み直す">更新</button><button type="button" class="primary" id="tk-new">＋ 新しいタスク</button></div>
    </div>
    <nav class="tk-views" role="tablist" aria-label="表示">
      <button type="button" role="tab" data-view="stages">ダッシュボード</button>
      <button type="button" role="tab" data-view="list">一覧</button>
      <button type="button" role="tab" data-view="next">次にやる</button>
      <button type="button" role="tab" data-view="timeline">日程</button>
      <button type="button" role="tab" data-view="sprint">スプリント</button>
      <button type="button" role="tab" data-view="summary">集計</button>
    </nav>
    <form class="tk-filter" id="tk-filter" onsubmit="return false">
      <input type="search" id="tk-search" placeholder="題名で絞り込む" aria-label="検索" class="tk-search">
      <select id="tk-assignee" aria-label="担当者"></select>
      <select id="tk-sprint" aria-label="スプリント"></select>
      <select id="tk-milestone" aria-label="マイルストーン"></select>
      <label class="tk-check"><input type="checkbox" id="tk-ready"> 着手できるものだけ</label>
      <label class="tk-check"><input type="checkbox" id="tk-closed"> 完了したタスクも表示</label>
      <label class="tk-check" title="削除したタスク（GitHubでは「対応しない」として閉じたもの）は、ふだんは表示しません"><input type="checkbox" id="tk-deleted"> 削除したタスクも表示</label>
    </form>
    <div class="tk-body"><div class="tk-main" id="tk-main"></div><aside class="tk-detail" id="tk-detail" aria-label="タスクの詳細"></aside></div>
  </section>
  <div id="help-content" class="help-page" hidden><section id="help" aria-labelledby="help-title"></section></div>
  <section id="modinfo-content" class="mi" aria-label="モジュール" hidden>
    <div class="mi-top"><div class="mi-top-row"><h2>モジュール</h2><button type="button" data-mi-reload title="最新の情報に更新">更新</button></div><nav class="mi-tabs" role="tablist" aria-label="モジュールの情報"><button type="button" role="tab" data-mi-view="home">ホーム</button><button type="button" role="tab" data-mi-view="projects">Project</button><button type="button" role="tab" data-mi-view="deps">依存</button></nav></div>
    <div class="mi-main"></div>
  </section>
  <section id="modagent-content" class="mi" aria-label="エージェント" hidden>
    <div class="mi-top"><div class="mi-top-row"><h2>エージェント</h2><button type="button" id="modagent-reload" title="最新の情報に更新">更新</button></div></div>
    <div class="mi-main ma-main" id="modagent-main"></div>
  </section>
  <section id="manage-content" class="mi br" aria-label="管理" hidden>
    <div class="mi-top"><div class="mi-top-row"><h2>管理</h2><button type="button" id="manage-reload" title="最新の情報に更新">更新</button></div>
      <div class="manage-tabs-row"><nav class="mi-tabs" id="manage-tabs" role="tablist" aria-label="管理"><button type="button" role="tab" data-manage-view="members" aria-selected="true">メンバー</button><button type="button" role="tab" data-manage-view="ci" aria-selected="false">CI</button></nav>
        <div class="br-top-actions" data-manage-for="ci" hidden><button type="button" id="ci-actions" title="GitHub の Actions の画面を開きます">GitHub で見る</button><button type="button" class="primary" id="ci-run" title="GitHub にあるブランチの内容で CI を動かします">▶ 手動で実行</button></div></div></div>
    <div class="members-main" id="members-main" data-manage-view-panel="members" role="tabpanel" aria-label="メンバー"></div>
    <div class="ci-main" id="ci-main" data-manage-view-panel="ci" role="tabpanel" aria-label="CI" hidden></div>
  </section>
  <section id="branches-content" class="mi br" aria-label="ブランチ" hidden>
    <div class="mi-top"><div class="mi-top-row"><h2>ブランチ</h2><div class="br-top-actions"><button type="button" id="br-log" title="すべてのブランチの履歴（マージを含む）を TortoiseGit で見ます">ログ</button><button type="button" class="primary" id="br-create">＋ ブランチ</button><button type="button" id="br-reload" title="最新の情報に更新">更新</button></div></div></div>
    <div class="br-body"><nav class="br-side" id="br-side" role="tablist" aria-orientation="vertical" aria-label="共有ブランチ"></nav><div class="br-main" id="br-main" role="tabpanel"></div></div>
  </section>
  <section id="settings-content" class="mi" aria-label="設定" hidden>
    <div class="mi-top"><div class="mi-top-row"><h2>設定</h2><button type="button" data-mi-reload title="最新の情報に更新">更新</button></div><nav class="mi-tabs" role="tablist" aria-label="モジュールの設定"><button type="button" role="tab" data-mi-view="profiles">ビルド設定</button><button type="button" role="tab" data-mi-view="general">全般</button><button type="button" role="tab" data-mi-view="templates">ファイルテンプレート</button><button type="button" role="tab" data-mi-view="container">コンテナ</button></nav></div>
    <div class="mi-main"></div>
  </section>
</div>
<dialog id="tk-person-dialog" class="tk-dialog wide tk-person-dialog" aria-label="アカウント"><div id="tk-person-body"></div></dialog>
<script src="common.js"></script><script src="module.js"></script><script src="tasks.js"></script><script src="modinfo.js"></script><script src="branches.js"></script><script src="submissions.js"></script><script src="members.js"></script><script src="ci.js"></script><script src="modagent.js"></script><script src="help.js"></script>
</body></html>
