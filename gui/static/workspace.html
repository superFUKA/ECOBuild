<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>作業空間 — ECOBuild</title>
<link rel="stylesheet" href="module.css"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="logview.css"><link rel="stylesheet" href="panels.css"></head>
<body>
<header><strong>ECOBuild</strong><span class="divider">/</span><h1 id="module-name"></h1><span class="workspace" id="workspace-label"></span></header>
<div class="build-bar" role="toolbar" aria-label="ビルド・テスト・実行">
  <div class="bar-left">
    <button type="button" id="build-setting" class="config-button" aria-haspopup="menu" aria-label="構成・ビルド設定" data-tip="構成・ビルド設定"><span id="build-setting-text">Debug</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><select id="build-config" hidden><option value="">ビルド設定のまま</option></select><select id="build-profile" hidden></select>
    <span class="bar-separator" aria-hidden="true"></span>
    <span class="build-group" role="group" aria-label="ビルド"><button type="button" class="tool-button" data-build="build" aria-label="ビルド" data-tip="ビルド"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></button><button type="button" id="build-menu" aria-haspopup="menu" aria-label="ビルドのその他の操作" data-tip="ビルドの操作"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></span>
    <span class="build-group" role="group" aria-label="テスト"><button type="button" class="tool-button" data-build="test" aria-label="テスト" data-tip="テスト（すべて）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg></button><button type="button" id="test-menu" class="group-menu" aria-haspopup="menu" aria-label="テストを選ぶ" data-tip="テストを選ぶ" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></span>
  </div>
  <div class="bar-center">
    <span class="run-group" role="group" aria-label="実行"><button type="button" class="run-button" data-build="run" aria-label="実行" data-tip="実行"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5l15 8.5-15 8.5z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></button><span id="build-project-label" class="run-target"><button type="button" id="build-project-pick" aria-haspopup="menu" aria-label="ビルド・実行の対象" data-tip="対象"><span class="run-target-name" hidden></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><select id="build-project" hidden></select></span></span>
    <input id="build-run-args" type="hidden">
  </div>
  <div class="bar-right"><button type="button" id="branch-label" class="branch-button" data-tip="この作業空間のブランチ（クリックで名前をコピー）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="7" r="2.2"/><path d="M6 7.2v9.6M18 9.2c0 5-12 3-12 7.6"/></svg><span id="branch-name"></span></button><button type="button" id="open-folder" class="tool-button" aria-label="フォルダを開く" data-tip="フォルダを開く"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button><button type="button" id="account-button" class="tool-button container-button account-button" aria-haspopup="menu" data-tip="この作業空間で使う GitHub のアカウント"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span id="account-label">…</span></button><button type="button" id="container-button" class="tool-button container-button" aria-haspopup="menu" data-tip="コンテナ"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span id="container-label">コンテナ</span></button><span class="vs-group agent-group" role="group" aria-label="AI"><button type="button" id="agent-start" class="vs-button agent-button" data-tip="この作業空間のルートで、AI（コーディングエージェント）を新しい画面で起動します">エージェント</button><button type="button" id="agent-more" class="vs-more" aria-haspopup="menu" data-tip="AIのその他の操作" aria-label="AIのその他の操作"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></span><span class="vs-group" id="vs-group" role="group" aria-label="エディタで開く"><button type="button" id="open-vs" class="vs-button" data-tip="この作業空間のソリューションを開きます（なければビルドして作成）">VS2026</button><button type="button" id="choose-vs" class="vs-more" aria-haspopup="menu" data-tip="開くエディタを選択（選ぶだけで、開きません）" aria-label="開くエディタを選ぶ"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></span></div>
</div>
<main>
  <aside aria-labelledby="files-title"><div class="explorer-heading"><h2 id="files-title">エクスプローラー</h2><span class="explorer-tools"><button id="new-file" title="新しいファイル" aria-label="新しいファイル"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg></button><button id="new-folder" title="新しいフォルダ" aria-label="新しいフォルダ"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg></button><button id="toggle-generated" aria-pressed="false" aria-label="生成ファイルの表示" title="生成ファイル（CMakeLists.txt 等）も表示"><span class="eye-on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="eye-off"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 4.1-5M9.9 5.2A9 9 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/></svg></span></button><button id="refresh-sln" class="sln-button" hidden title="ソリューション（.sln）と生成ファイルを今の構成で作り直す" aria-label="SLN を更新">SLN</button><button id="reload-files" title="読み直す" aria-label="読み直す"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button></span></div><div id="file-tree"></div>
    <div class="eco-menu" id="file-menu" hidden role="menu"></div></aside>
  <section class="work" aria-labelledby="changes-title">
    <div class="heading"><h2 id="changes-title">コミット・共有</h2></div>
    <div id="banners"></div>
    <div class="work-tabs" id="work-tabs" role="tablist" aria-label="コミット・Push・提出"><button type="button" role="tab" data-tab="commit-panel">コミット<span class="tab-count" id="commit-panel-count"></span></button><button type="button" role="tab" data-tab="share-panel">Push<span class="tab-count" id="share-panel-count"></span></button><button type="button" role="tab" data-tab="prs-panel">提出<span class="tab-count" id="prs-panel-count"></span></button><button type="button" role="tab" data-tab="history-panel">ログ</button></div>
    <section class="panel commit-panel" id="commit-panel" role="tabpanel" aria-labelledby="commit-title">
      <div class="heading"><h3 id="commit-title">コミット</h3></div>
      <textarea id="commit-message" rows="3" placeholder="コミットメッセージ（何を・なぜ変えたか）" aria-label="コミットメッセージ"></textarea>
      <div class="actions"><label><input type="checkbox" id="amend"> 直前のコミットを修正</label><button id="commit" class="primary">コミット</button></div>
      <div class="change-head"><label class="select-all"><input type="checkbox" id="select-all"> 変更ファイル<span id="change-count"></span></label>
        <span class="change-tools"><span id="stage-tools" hidden><button data-git="stage" title="衝突を直したファイルを、直したものとして記録します">ステージ</button><button data-git="unstage">ステージを取り消す</button></span><button data-git="diff">差分</button><button data-git="discard">元に戻す…</button><button type="button" id="stash-menu" aria-haspopup="menu" title="未コミットの変更を一時的にしまう・戻す">退避</button></span></div>
      <div id="changes"></div></section>
    <section class="panel share" id="share-panel" role="tabpanel" aria-labelledby="share-title">
      <div class="heading"><h3 id="share-title">Push</h3><span id="push-state" class="muted"></span></div>
      <div id="push-commits" class="push-commits-box" hidden><div class="push-commits-head"><span id="push-commits-title">Pushするコミット（新しい順）</span><button type="button" id="push-commits-close" class="link-button">閉じる</button></div><div id="push-commits-view"></div></div>
      <div class="actions"><details class="share-more"><summary aria-label="取り込み・その他のPush">⋯</summary><div><button type="button" data-git="sync" title="GitHub の最新（タスクブランチなら作成元の最新も）を取り込みます">最新を取り込む</button><button type="button" data-git="sync-from" title="別の管理ブランチ・別のタスクブランチの変更を、このタスクブランチへ取り込みます">ほかのブランチから取り込む…</button><button type="button" data-git="force-push">強制Push…</button></div></details><button id="push" class="primary">Push</button></div></section>
    <section class="panel" id="prs-panel" role="tabpanel" aria-labelledby="prs-title"><div class="heading"><h3 id="prs-title">提出</h3></div><div id="pr-tools"></div><p id="pr-note" class="pr-note" hidden></p>
      <div id="pr-commits" class="pr-commits-box" hidden><div class="push-commits-head"><span id="pr-commits-title">提出に入るコミット</span><button type="button" id="pr-full-log" class="link-button" title="作成元のコミットも含めた、このブランチのすべてのログを別の窓で開きます">すべてのログ</button></div><div id="pr-commits-view"></div></div>
      <div id="pr-detail"></div></section>
    <section class="panel" id="history-panel" role="tabpanel" aria-labelledby="history-title"><div class="heading"><h3 id="history-title">ログ</h3><label class="history-branch">ブランチ <select id="history-branch" title="どのブランチの履歴を見るか（取り出さずに読みます）"><option value="">今のブランチ</option></select></label></div><div id="history-view"></div></section>
    <p id="operation-status" role="status"></p>
  </section>
</main>
<section id="footer" class="footer panel-host" hidden aria-label="下の欄"><div class="panel-resize" title="ドラッグで高さを変える" aria-hidden="true"></div>
  <div class="panel-bar"><div class="panel-tabs" role="tablist" aria-label="下の欄"></div><span class="panel-bar-tools"><button type="button" data-footer="max" aria-pressed="false" title="大きく表示" aria-label="大きく表示">⤢</button><button type="button" data-footer="close" title="下の欄を隠す（Ctrl+J で再表示）" aria-label="下の欄を隠す">×</button></span></div>
  <div class="panel-body"></div></section>
<footer id="status-bar" class="status-bar" aria-label="作業空間の状態">
  <div class="status-left" id="status-panels"><button type="button" id="toggle-output" class="status-item" aria-pressed="false" title="出力を出す・しまう（Ctrl+J）"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18"/></svg><span>出力</span><span id="output-state" class="status-run" hidden></span></button></div>
  <div class="status-right"><span id="status-push" class="status-item status-text"></span><span id="status-base" class="status-item status-text" hidden></span><button type="button" id="status-fetch" class="status-item" data-git="fetch" title="GitHub の最新を確認します（作成元の遅れ・取り込むと衝突するファイル）"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg><span id="status-fetched">未確認</span></button></div>
</footer>
<script src="common.js"></script><script src="logview.js"></script><script src="outputview.js"></script><script src="panels.js"></script><script src="workspace.js"></script><script src="explorer.js"></script><script src="prs.js"></script><script src="imageeditor.js"></script><script src="build.js"></script>
</body></html>
