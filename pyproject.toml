[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecobuild"
version = "0.1.0"
description = "GitHubとCppBuildをつなぐ、C++モジュールの開発管理CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 依存はGitHubのURLとコミットIDで固定する（リポジトリの外のファイルは参照しない）。
    "cppbuild @ git+https://github.com/superFUKA/CppBuild@2b901f1b80b748ce706b33ceb6a293fc3e09fda9",
    "cli-framework @ git+https://github.com/superFUKA/CLIFrameWork@dba38127be5c1778d1b183ab015f2ec5758ded54",
    # ツールの設定の置き場所（OSの慣例、I-030）
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
ecobuild = "ecobuild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecobuild = ["module_types.toml"]
ecobuild_cpp = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: 本物のgitと手元のbareリポジトリを使う",
    "cppbuild: 本物のCppBuild・CMake・コンパイラを使う（時間がかかる）",
    "github: 本物のGitHubを使う（ECOBUILD_GITHUB_TESTS=1のときだけ実行）",
]
