[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecobuild"
version = "0.1.0"
description = "作業空間（GitHub Issue）を中心にしたモジュールの開発管理。本体（ライブラリ）・拡張（CppBuild等の型）・CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 依存はGitHubのURLとコミットIDで固定する（リポジトリの外のファイルは参照しない）。
    "cppbuild @ git+https://github.com/superFUKA/CppBuild@e83c7a0a03d18c5795ec0de98005ff6a4258cd54",
    "cli-framework @ git+https://github.com/superFUKA/CLIFrameWork@d5959533cb15ea2c4c3916588ae664271748a8fb",
    # ツールの設定の置き場所（OSの慣例、I-030）
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
ecobuild = "ecobuild_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecobuild_bundle = ["module_types.toml"]
ecobuild_cpp = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: 本物のgitと手元のbareリポジトリを使う",
    "cppbuild: 本物のCppBuild・CMake・コンパイラを使う（時間がかかる）",
    "python: 本物のvenv・pipを使う（ネットワークが要る。時間がかかる）",
    "github: 本物のGitHubを使う（ECOBUILD_GITHUB_TESTS=1のときだけ実行）",
]
