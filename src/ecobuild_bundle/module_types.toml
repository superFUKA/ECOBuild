# モジュールの型の登録（ecobuild_bundle・CLI が使う同梱の型）。ecobuild.toml の [module] type で選ぶ。
# 型を足すときは、ModuleType（ecobuild.module_type）の子クラスを実装し、ここに追記する。
# （本体のライブラリとしては、Registry に型を渡せばよい。この登録ファイルは ecobuild_bundle・CLI が使う型）
# 型のコマンド（ecobuild build・file 等）は、<実装のPythonモジュール>.cli パッケージに置く（CLI がその型のモジュールの中でだけ出す）。
#
# [<型の名前>]
# module = "<実装のPythonモジュール>"
# class = "<ModuleType の子クラス>"
# description = "<説明>"

[cpp]
module = "ecobuild_cpp"
class = "CppType"
description = "C++。CppBuildでProject・ファイル・ビルド・テスト・依存先を管理する"

[generic]
module = "ecobuild_generic"
class = "GenericType"
description = "言語を問わない。ビルド・テスト・実行のコマンドを ecobuild.toml の [commands] に書く"

[python]
module = "ecobuild_python"
class = "PythonType"
description = "Python。venv・pip・pytest でビルド・テスト・実行・ファイルの追加をする"
