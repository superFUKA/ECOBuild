<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>モジュール — ECOBuild</title>
<link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="tasks.css"><link rel="stylesheet" href="modinfo.css"><link rel="stylesheet" href="common.css"></head>
<body>
<header><strong>ECOBuild</strong><span>/</span><h1 id="module-title"></h1><span id="module-path" class="tk-muted"></span>
  <div class="header-actions"><button type="button" id="open-folder" title="エクスプローラーで開く">フォルダを開く</button></div></header>
<div class="module-shell">
  <nav class="module-nav" aria-label="モジュールメニュー">
    <button type="button" id="nav-toggle" class="nav-toggle" aria-expanded="true" title="メニューを細くする"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button type="button" id="modinfo-menu" aria-controls="modinfo-content" title="モジュール"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span>モジュール</span></button>
    <button type="button" id="workspace-menu" aria-current="page" aria-controls="workspace-content" title="作業空間"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>作業空間</span></button>
    <button type="button" id="tasks-menu" aria-controls="tasks-content" title="タスク管理"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>タスク管理</span></button>
  </nav>
  <section class="module-content" id="workspace-content" aria-labelledby="workspace-menu"><nav class="tabs" role="tablist" aria-label="作業空間"></nav><div class="panels"></div></section>
  <section id="tasks-content" class="tk" aria-label="タスク管理" hidden>
    <div class="tk-top">
      <div class="tk-top-title"><h2>タスク管理</h2><button type="button" class="tk-board-chip" id="tk-board-chip" title="ボードの設定"><span class="tk-board-icon" aria-hidden="true">▦</span><span id="tk-board-name">ボード</span><span class="tk-pill" id="tk-board-pill"></span></button></div>
      <div class="tk-top-actions"><button type="button" id="tk-reload" title="GitHubから読み直す">更新</button><button type="button" id="tk-sync">ボードを同期</button><button type="button" class="primary" id="tk-new">＋ 新しいタスク</button></div>
    </div>
    <nav class="tk-views" role="tablist" aria-label="表示">
      <button type="button" role="tab" data-view="list">一覧</button>
      <button type="button" role="tab" data-view="board">ボード</button>
      <button type="button" role="tab" data-view="timeline">日程</button>
    </nav>
    <form class="tk-filter" id="tk-filter" onsubmit="return false">
      <input type="search" id="tk-search" placeholder="題名で絞り込む" aria-label="検索" class="tk-search">
      <select id="tk-assignee" aria-label="担当者"></select>
      <label class="tk-check"><input type="checkbox" id="tk-ready"> 着手できるものだけ</label>
      <label class="tk-check"><input type="checkbox" id="tk-closed"> 閉じたものも</label>
    </form>
    <div class="tk-body"><div class="tk-main" id="tk-main"></div><aside class="tk-detail" id="tk-detail" aria-label="タスクの詳細"></aside></div>
  </section>
  <section id="modinfo-content" class="mi" aria-label="モジュール" hidden>
    <div class="mi-top"><h2>モジュール</h2><nav class="mi-tabs" role="tablist" aria-label="モジュールの情報"><button type="button" role="tab" data-mi-view="projects">Project</button><button type="button" role="tab" data-mi-view="deps">依存</button><button type="button" role="tab" data-mi-view="branches">ブランチ</button><button type="button" role="tab" data-mi-view="profiles">ビルド設定</button></nav></div>
    <div class="mi-main" id="mi-main"></div>
  </section>
</div>
<dialog id="tk-person-dialog" class="tk-dialog wide tk-person-dialog" aria-label="アカウント"><div id="tk-person-body"></div></dialog>
<script src="common.js"></script><script src="module.js"></script><script src="tasks.js"></script><script src="modinfo.js"></script>
</body></html>
